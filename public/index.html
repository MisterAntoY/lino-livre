<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lino Livre — Livros Digitais Gratuitos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Barra Superior / Header Limpo -->
  <header class="site-header">
    <div class="container header-content">
      <div class="brand">
        <div class="brand-icon">📚</div>
        <div>
          <h1 class="brand-title">Lino Livre</h1>
          <p class="brand-subtitle">Livros livres, para todos.</p>
        </div>
      </div>
      <button class="btn btn-outline" onclick="app.abrirModalNovoLivro()">+ Adicionar Livro</button>
    </div>
  </header>

  <!-- Filtros e Busca Simples -->
  <section class="container filter-section">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="filtro-busca" placeholder="Pesquisar por título ou autor..." oninput="app.filtrar()">
    </div>

    <!-- Pílulas de filtro de formato e categoria -->
    <div class="pills-container" id="pills-categorias">
      <button class="pill active" data-categoria="" onclick="app.filtrarPorCategoria('')">Todos</button>
      <button class="pill" data-categoria="Clássicos Brasileiros" onclick="app.filtrarPorCategoria('Clássicos Brasileiros')">Clássicos Brasileiros</button>
      <button class="pill" data-categoria="Romance & Crônicas" onclick="app.filtrarPorCategoria('Romance & Crônicas')">Romances</button>
      <button class="pill" data-categoria="Teatro & Poesia" onclick="app.filtrarPorCategoria('Teatro & Poesia')">Poesia</button>
      <button class="pill" data-categoria="Apoio Pedagógico & Filosofia" onclick="app.filtrarPorCategoria('Apoio Pedagógico & Filosofia')">Ensaios</button>
    </div>
  </section>

  <!-- Catálogo de Livros -->
  <main class="container main-container">
    <div id="grade-livros" class="books-grid">
      <div class="loading">Carregando acervo digital...</div>
    </div>
  </main>

  <!-- Rodapé Simples -->
  <footer class="site-footer">
    <div class="container footer-content">
      <p>Biblioteca Digital Escolar • Obras em Domínio Público • Acesso Livre e Gratuito</p>
    </div>
  </footer>

  <!-- MODAL: LEITOR ONLINE SIMPLES -->
  <div id="modal-leitor" class="modal-backdrop hidden">
    <div class="reader-modal">
      <div class="reader-header">
        <div>
          <h3 id="leitor-titulo" class="reader-title">Título do Livro</h3>
          <p id="leitor-autor" class="reader-subtitle">Autor</p>
        </div>
        <div class="reader-actions">
          <button class="btn-text" onclick="app.alterarFonte(-2)">A-</button>
          <button class="btn-text" onclick="app.alterarFonte(2)">A+</button>
          <button id="btn-leitor-download" class="btn btn-sm btn-primary">⬇ Baixar Arquivo</button>
          <button class="btn-close" onclick="app.fecharModais()">&times;</button>
        </div>
      </div>
      <div class="reader-body">
        <div id="leitor-texto" class="reader-content font-serif"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: ADICIONAR NOVO LIVRO -->
  <div id="modal-novo-livro" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-card-header">
        <h3>Adicionar Novo Livro Digital</h3>
        <button class="btn-close" onclick="app.fecharModais()">&times;</button>
      </div>
      <form onsubmit="app.salvarNovoLivro(event)" class="modal-card-body">
        <div class="form-group">
          <label>Título *</label>
          <input type="text" id="novo-titulo" class="form-input" required placeholder="Ex: Dom Casmurro">
        </div>
        <div class="form-group">
          <label>Autor *</label>
          <input type="text" id="novo-autor" class="form-input" required placeholder="Ex: Machado de Assis">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Formato *</label>
            <select id="novo-formato" class="form-input">
              <option value="PDF">PDF</option>
              <option value="EPUB">EPUB</option>
              <option value="Web">Web</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ano de Publicação</label>
            <input type="number" id="novo-ano" class="form-input" placeholder="Ex: 1899">
          </div>
        </div>
        <div class="form-group">
          <label>URL do Arquivo para Download</label>
          <input type="url" id="novo-arquivo-url" class="form-input" placeholder="https://exemplo.com/livro.pdf">
        </div>
        <div class="form-group">
          <label>Sinopse</label>
          <textarea id="novo-sinopse" class="form-input" rows="2" placeholder="Breve resumo da obra..."></textarea>
        </div>
        <div class="form-group">
          <label>Texto da Obra para Leitura Online</label>
          <textarea id="novo-conteudo" class="form-input" rows="4" placeholder="Cole aqui o texto dos capítulos..."></textarea>
        </div>
        <div class="modal-card-footer">
          <button type="button" class="btn btn-secondary" onclick="app.fecharModais()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar no Acervo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast de Notificação -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
