<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-policarpo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#ede7d8"/>
      <stop offset="100%" stop-color="#ded4be"/>
    </radialGradient>
  </defs>

  <rect width="400" height="580" fill="url(#bg-policarpo)"/>

  <!-- Moldura pré-modernista -->
  <rect x="22" y="22" width="356" height="536" fill="none" stroke="#1c1917" stroke-width="2.5"/>
  <rect x="30" y="30" width="340" height="520" fill="none" stroke="#15803d" stroke-width="1.2"/>

  <!-- Autor -->
  <text x="200" y="115" font-family="'Georgia', serif" font-size="18" letter-spacing="4" font-weight="bold" fill="#1c1917" text-anchor="middle">LIMA BARRETO</text>
  <line x1="120" y1="135" x2="280" y2="135" stroke="#15803d" stroke-width="1.5"/>

  <!-- Título principal -->
  <text x="200" y="225" font-family="'Georgia', serif" font-size="26" letter-spacing="3" font-weight="bold" fill="#15803d" text-anchor="middle">TRISTE FIM</text>
  <text x="200" y="255" font-family="'Georgia', serif" font-size="16" letter-spacing="3" font-style="italic" fill="#44403c" text-anchor="middle">DE</text>
  <text x="200" y="295" font-family="'Georgia', serif" font-size="28" letter-spacing="3" font-weight="bold" fill="#1c1917" text-anchor="middle">POLICARPO</text>
  <text x="200" y="335" font-family="'Georgia', serif" font-size="28" letter-spacing="4" font-weight="bold" fill="#1c1917" text-anchor="middle">QUARESMA</text>

  <!-- Ornato central -->
  <g transform="translate(200, 395)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#15803d" stroke-width="1.2"/>
    <text x="0" y="6" font-family="'Georgia', serif" font-size="18" fill="#1c1917" text-anchor="middle">✦</text>
  </g>

  <!-- Subtítulo histórico -->
  <text x="200" y="440" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-style="italic" fill="#57534e" text-anchor="middle">EDIÇÃO HISTÓRICA COMPLETA</text>

  <!-- Edição original 1915 -->
  <line x1="110" y1="475" x2="290" y2="475" stroke="#1c1917" stroke-width="1"/>
  <text x="200" y="500" font-family="'Georgia', serif" font-size="13" letter-spacing="3" font-weight="bold" fill="#1c1917" text-anchor="middle">RIO DE JANEIRO</text>
  <text x="200" y="520" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#57534e" text-anchor="middle">TYP. REVISTA DO BRASIL</text>
  <text x="200" y="540" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#15803d" text-anchor="middle">1915</text>
</svg>
