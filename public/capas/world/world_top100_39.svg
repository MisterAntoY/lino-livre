  <text x="40" y="407.375" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">How to Win Friends and Influence</text>
<text x="40" y="425.375" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">People</text>


