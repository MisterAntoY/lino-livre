  <!-- Barra divisória de destaque -->
  <rect x="40" y="298.875" width="48" height="4" rx="2" fill="#38bdf8"/>

  <!-- Título da Obra -->
  <text x="40" y="326.875" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#f8fafc">Como Fazer Amigos e</text>
<text x="40" y="363.125" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#f8fafc">Influenciar Pessoas</text>


