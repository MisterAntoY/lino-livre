  </defs>

  <!-- Fundo com gradiente e textura sutil -->
  <rect width="400" height="600" fill="url(#bgGrad_world_top100_39)"/>
  <rect width="400" height="600" fill="url(#pat_bgGrad_world_top100_39)"/>

  <!-- Brilho radial focal atrás do emblema -->
