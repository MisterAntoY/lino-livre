<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad_845" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#2e083a"/>
    </linearGradient>
    <linearGradient id="glowGrad_845" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern_845" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bgGrad_845)"/>
  <rect width="400" height="600" fill="url(#gridPattern_845)"/>
  <circle cx="200" cy="215" r="105" fill="url(#glowGrad_845)"/>
  <rect x="0" y="0" width="14" height="600" fill="rgba(0,0,0,0.4)"/>
  <line x1="14" y1="0" x2="14" y2="600" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Badge PALOP / Época -->
  <g transform="translate(40, 42)">
    <rect width="190" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="95" y="17" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="middle">ANGOLA · 1889</text>
  </g>

  <!-- Emblema Central -->
  <g transform="translate(200, 215)">
    <circle r="65" fill="rgba(0,0,0,0.35)" stroke="#f472b6" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="55" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="0" y="16" font-size="44" text-anchor="middle">🌅</text>
  </g>

  <!-- Título e Subtítulo -->
  <g transform="translate(200, 355)" text-anchor="middle">
    <text y="0" fill="#ffffff" font-family="Georgia, serif" font-size="24" font-weight="700" letter-spacing="0.5">Delírios</text>
    <text y="28" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">Poesia Angolense Oitocentista</text>
  </g>

  <!-- Linha divisória clássica -->
  <line x1="100" y1="420" x2="300" y2="420" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="200" cy="420" r="3" fill="#f472b6"/>

  <!-- Autor -->
  <g transform="translate(200, 465)" text-anchor="middle">
    <text y="0" fill="#f472b6" font-family="Georgia, serif" font-size="16" font-weight="600" font-style="italic">Gervásio Silva</text>
    <text y="22" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">CLÁSSICOS DOS PALOP</text>
  </g>

  <!-- Rodapé Lino Livre -->
  <g transform="translate(200, 560)" text-anchor="middle">
    <rect x="-85" y="-18" width="170" height="24" rx="12" fill="rgba(0,0,0,0.3)"/>
    <text y="-2" fill="rgba(255,255,255,0.45)" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="1">LINO LIVRE · DOMÍNIO PÚBLICO</text>
  </g>
</svg>