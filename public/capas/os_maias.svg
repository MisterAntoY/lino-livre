<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bgGrad)"/>
  <rect width="400" height="600" fill="url(#gridPattern)"/>
  <circle cx="200" cy="215" r="110" fill="url(#glowGrad)"/>
  <rect x="0" y="0" width="14" height="600" fill="rgba(0,0,0,0.4)"/>
  <line x1="14" y1="0" x2="14" y2="600" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Badge de gênero -->
  <g transform="translate(40, 42)">
    <rect width="180" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#818cf8"/>
    <text x="28" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">CANONE LUSÓFONO · 1888</text>
  </g>

  <!-- Emblema Clássico -->
  <g transform="translate(150, 150) scale(2.2)" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    <path d="M12 6v6m-3-3h6"/>
  </g>

  <rect x="40" y="330" width="48" height="4" rx="2" fill="#818cf8"/>
  <text x="40" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#f8fafc">Os Maias</text>
  <text x="40" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#a5b4fc">Episódios da Vida Romântica</text>
  <text x="40" y="455" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#cbd5e1">Eça de Queirós</text>

  <line x1="40" y1="535" x2="360" y2="535" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g transform="translate(40, 555)">
    <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
    <text x="16" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" letter-spacing="1">LINO LIVRE</text>
    <text x="96" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">• Acervo Clássico Aberto</text>
  </g>
</svg>
