<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-bras" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="70%" stop-color="#efe5d5"/>
      <stop offset="100%" stop-color="#ded0bd"/>
    </radialGradient>
  </defs>

  <rect width="400" height="580" fill="url(#bg-bras)"/>

  <!-- Bordas com filetes clássicos do século XIX -->
  <rect x="20" y="20" width="360" height="540" fill="none" stroke="#1f1f1f" stroke-width="2.5"/>
  <rect x="26" y="26" width="348" height="528" fill="none" stroke="#1f1f1f" stroke-width="0.8"/>
  <rect x="32" y="32" width="336" height="516" fill="none" stroke="#78593a" stroke-width="1.2"/>

  <!-- Detalhe superior -->
  <text x="200" y="85" font-family="'Georgia', serif" font-size="11" letter-spacing="3" fill="#66503b" text-anchor="middle">OBRAS DE</text>
  <text x="200" y="115" font-family="'Georgia', 'Times New Roman', serif" font-size="17" letter-spacing="4" font-weight="bold" fill="#1c1917" text-anchor="middle">MACHADO DE ASSIS</text>

  <line x1="130" y1="135" x2="270" y2="135" stroke="#1c1917" stroke-width="1"/>

  <!-- Título com grafia de época -->
  <text x="200" y="210" font-family="'Georgia', serif" font-size="27" letter-spacing="2.5" font-weight="bold" fill="#1c1917" text-anchor="middle">MEMORIAS</text>
  <text x="200" y="245" font-family="'Georgia', serif" font-size="25" letter-spacing="3" font-weight="bold" fill="#78350f" text-anchor="middle">POSTHUMAS</text>
  <text x="200" y="278" font-family="'Georgia', serif" font-size="15" letter-spacing="3" font-style="italic" fill="#57534e" text-anchor="middle">DE</text>
  <text x="200" y="318" font-family="'Georgia', serif" font-size="31" letter-spacing="3" font-weight="bold" fill="#1c1917" text-anchor="middle">BRAZ CUBAS</text>

  <!-- Epígrafe célebre -->
  <g transform="translate(200, 375)">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#78593a" stroke-width="0.8"/>
    <text x="0" y="22" font-family="'Georgia', serif" font-size="10" letter-spacing="1" font-style="italic" fill="#57534e" text-anchor="middle">"Ao verme que primeiro roeu as frias carnes</text>
    <text x="0" y="38" font-family="'Georgia', serif" font-size="10" letter-spacing="1" font-style="italic" fill="#57534e" text-anchor="middle">do meu cadaver dedico como saudosa lembrança"</text>
    <line x1="-80" y1="52" x2="80" y2="52" stroke="#78593a" stroke-width="0.8"/>
  </g>

  <!-- Rodapé Tipografia Nacional 1881 -->
  <text x="200" y="485" font-family="'Georgia', serif" font-size="12" letter-spacing="3" font-weight="bold" fill="#1c1917" text-anchor="middle">RIO DE JANEIRO</text>
  <text x="200" y="505" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#57534e" text-anchor="middle">TYPOGRAPHIA NACIONAL</text>
  <text x="200" y="525" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#78350f" text-anchor="middle">1881</text>
</svg>
