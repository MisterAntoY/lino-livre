<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-alienista" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fcf9f2"/>
      <stop offset="70%" stop-color="#f4ecdc"/>
      <stop offset="100%" stop-color="#dfd0b8"/>
    </radialGradient>
  </defs>

  <rect width="400" height="580" fill="url(#bg-alienista)"/>

  <!-- Moldura geométrica da virada do século -->
  <rect x="22" y="22" width="356" height="536" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="30" y="30" width="340" height="520" fill="none" stroke="#0369a1" stroke-width="1.2"/>

  <!-- Autor -->
  <text x="200" y="115" font-family="'Georgia', serif" font-size="17" letter-spacing="4" font-weight="bold" fill="#1e293b" text-anchor="middle">MACHADO DE ASSIS</text>
  <line x1="130" y1="135" x2="270" y2="135" stroke="#0369a1" stroke-width="1"/>

  <!-- Coleção -->
  <text x="200" y="190" font-family="'Georgia', serif" font-size="12" letter-spacing="3" font-style="italic" fill="#475569" text-anchor="middle">PAPÉIS AVULSOS</text>

  <!-- Título O ALIENISTA -->
  <text x="200" y="255" font-family="'Georgia', serif" font-size="36" letter-spacing="4" font-weight="bold" fill="#0c4a6e" text-anchor="middle">O ALIENISTA</text>

  <!-- Subtítulo -->
  <text x="200" y="295" font-family="'Georgia', serif" font-size="13" letter-spacing="2" font-style="italic" fill="#334155" text-anchor="middle">HISTÓRIA DE ITAGUAÍ</text>
  <text x="200" y="325" font-family="'Georgia', serif" font-size="11" letter-spacing="1" fill="#64748b" text-anchor="middle">E A CASA VERDE DO DR. SIMÃO BACAMARTE</text>

  <!-- Desenho central / chave simbólica -->
  <g transform="translate(200, 380)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#0369a1" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    <text x="0" y="7" font-family="'Georgia', serif" font-size="20" text-anchor="middle" fill="#0c4a6e">⚕</text>
  </g>

  <!-- Publicação original: Garnier 1882 -->
  <line x1="110" y1="465" x2="290" y2="465" stroke="#1e293b" stroke-width="1"/>
  <text x="200" y="495" font-family="'Georgia', serif" font-size="13" letter-spacing="3" font-weight="bold" fill="#1e293b" text-anchor="middle">RIO DE JANEIRO</text>
  <text x="200" y="515" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#475569" text-anchor="middle">LIVRARIA DE B. L. GARNIER</text>
  <text x="200" y="535" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#0369a1" text-anchor="middle">1882</text>
</svg>
