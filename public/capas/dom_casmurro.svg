<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="70%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#e2d2ba"/>
    </radialGradient>
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fff6e5" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
    </filter>
  </defs>

  <!-- Fundo papel antigo -->
  <rect width="400" height="580" fill="url(#vignette)"/>

  <!-- Borda externa ornamental -->
  <rect x="22" y="22" width="356" height="536" fill="none" stroke="#2b1e16" stroke-width="3"/>
  <rect x="28" y="28" width="344" height="524" fill="none" stroke="#2b1e16" stroke-width="1"/>
  <rect x="34" y="34" width="332" height="512" fill="none" stroke="#6e503b" stroke-width="0.75" stroke-dasharray="4 2"/>

  <!-- Cantoneiras decorativas vintage -->
  <path d="M 38 48 L 48 38 M 38 58 L 58 38 M 38 68 L 68 38" stroke="#2b1e16" stroke-width="1.2" fill="none"/>
  <path d="M 362 48 L 352 38 M 362 58 L 342 38 M 362 68 L 332 38" stroke="#2b1e16" stroke-width="1.2" fill="none"/>
  <path d="M 38 532 L 48 542 M 38 522 L 58 542 M 38 512 L 68 542" stroke="#2b1e16" stroke-width="1.2" fill="none"/>
  <path d="M 362 532 L 352 542 M 362 522 L 342 542 M 362 512 L 332 542" stroke="#2b1e16" stroke-width="1.2" fill="none"/>

  <!-- Ornato de topo -->
  <path d="M 170 70 Q 200 62 230 70 Q 200 78 170 70 Z" fill="#2b1e16"/>
  <circle cx="200" cy="70" r="3" fill="#8c2d19"/>

  <!-- Autor -->
  <text x="200" y="118" font-family="'Georgia', 'Times New Roman', serif" font-size="16" letter-spacing="4" font-weight="bold" fill="#2b1e16" text-anchor="middle">MACHADO DE ASSIS</text>
  <text x="200" y="136" font-family="'Georgia', serif" font-size="11" letter-spacing="2" font-style="italic" fill="#6e503b" text-anchor="middle">DA ACADEMIA BRASILEIRA</text>

  <!-- Linha divisória fina -->
  <line x1="120" y1="160" x2="280" y2="160" stroke="#8c2d19" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="2.5" fill="#8c2d19"/>

  <!-- Título principal -->
  <text x="200" y="240" font-family="'Georgia', 'Times New Roman', serif" font-size="34" letter-spacing="3" font-weight="bold" fill="#8c2d19" text-anchor="middle">DOM</text>
  <text x="200" y="285" font-family="'Georgia', 'Times New Roman', serif" font-size="36" letter-spacing="4" font-weight="bold" fill="#1f1610" text-anchor="middle">CASMURRO</text>

  <!-- Medalhão / Brasão central -->
  <g transform="translate(200, 345)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#2b1e16" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#8c2d19" stroke-width="0.8"/>
    <path d="M -12 0 C -6 -10 6 -10 12 0 C 6 10 -6 10 -12 0 Z" fill="#2b1e16"/>
    <circle cx="0" cy="0" r="4" fill="#8c2d19"/>
  </g>

  <!-- Subtítulo e dados históricos -->
  <text x="200" y="410" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-style="italic" fill="#523927" text-anchor="middle">EDIÇÃO ORIGINAL COMPLETA</text>
  <text x="200" y="430" font-family="'Georgia', serif" font-size="11" letter-spacing="1" fill="#6e503b" text-anchor="middle">DOMÍNIO PÚBLICO • ACERVO ESCOLAR</text>

  <!-- Editor e ano (Garnier 1899) -->
  <line x1="100" y1="475" x2="300" y2="475" stroke="#2b1e16" stroke-width="0.8"/>
  <text x="200" y="498" font-family="'Georgia', serif" font-size="13" letter-spacing="3" font-weight="bold" fill="#2b1e16" text-anchor="middle">RIO DE JANEIRO — PARIS</text>
  <text x="200" y="516" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#523927" text-anchor="middle">H. GARNIER, LIVREIRO-EDITOR</text>
  <text x="200" y="534" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#8c2d19" text-anchor="middle">1899</text>
</svg>
