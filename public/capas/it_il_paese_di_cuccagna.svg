<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1f0c"/>
      <stop offset="100%" stop-color="#120a04"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bgGrad)"/>
  <rect width="400" height="600" fill="url(#gridPattern)"/>
  <circle cx="200" cy="215" r="105" fill="url(#glowGrad)"/>
  <rect x="0" y="0" width="14" height="600" fill="rgba(0,0,0,0.4)"/>
  <line x1="14" y1="0" x2="14" y2="600" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Badge de idioma -->
  <g transform="translate(40, 42)">
    <rect width="150" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#f59e0b"/>
    <text x="28" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">ITALIANO · 1891</text>
  </g>

  <!-- Icone: pena e tinta -->
  <g transform="translate(140, 140)">
    <path d="M22 4c-9 0-16 7-16 16v54l-8 12h10l8-12V20c0-9 7-16 16-16 4 0 7 1 10 3-3-5-9-7-14-7z" fill="#f59e0b"/>
    <path d="M78 4c9 0 16 7 16 16v54l8 12H92l-8-12V20c0-9-7-16-16-16-4 0-7 1-10 3 3-5 9-7 14-7z" fill="#fcd34d"/>
    <path d="M50 30l14 22-8 26-6 30-8-30-6-26z" fill="#fef3c7" opacity="0.9"/>
    <path d="M50 30l14 22-8 26-6 30-8-30-6-26z" fill="none" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <rect x="40" y="330" width="48" height="4" rx="2" fill="#f59e0b"/>

  <text x="40" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f8fafc">Il paese</text>
  <text x="40" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f8fafc">di cuccagna</text>
  <text x="40" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#fcd34d">Matilde Serao</text>

  <line x1="40" y1="535" x2="360" y2="535" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <g transform="translate(40, 555)">
    <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
    <text x="16" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" letter-spacing="1">LINO LIVRE</text>
    <text x="96" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#64748b">• Acervo Digital Aberto</text>
  </g>
