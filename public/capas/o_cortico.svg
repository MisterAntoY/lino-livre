<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-cortico" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fefbf3"/>
      <stop offset="70%" stop-color="#f6eddc"/>
      <stop offset="100%" stop-color="#e5d4bc"/>
    </radialGradient>
  </defs>

  <rect width="400" height="580" fill="url(#bg-cortico)"/>

  <!-- Moldura ornamental de época naturalista -->
  <rect x="22" y="22" width="356" height="536" fill="none" stroke="#261c14" stroke-width="3"/>
  <rect x="28" y="28" width="344" height="524" fill="none" stroke="#9a3412" stroke-width="1.2"/>
  <rect x="36" y="36" width="328" height="508" fill="none" stroke="#261c14" stroke-width="0.8"/>

  <!-- Ornatos nos cantos -->
  <circle cx="36" cy="36" r="4" fill="#9a3412"/>
  <circle cx="364" cy="36" r="4" fill="#9a3412"/>
  <circle cx="36" cy="544" r="4" fill="#9a3412"/>
  <circle cx="364" cy="544" r="4" fill="#9a3412"/>

  <!-- Autor -->
  <text x="200" y="115" font-family="'Georgia', serif" font-size="18" letter-spacing="4" font-weight="bold" fill="#261c14" text-anchor="middle">ALUÍSIO AZEVEDO</text>

  <line x1="120" y1="140" x2="280" y2="140" stroke="#9a3412" stroke-width="1.5"/>

  <!-- Título O CORTIÇO -->
  <text x="200" y="240" font-family="'Georgia', serif" font-size="42" letter-spacing="4" font-weight="bold" fill="#9a3412" text-anchor="middle">O CORTIÇO</text>

  <!-- Classificação e subtítulo -->
  <text x="200" y="285" font-family="'Georgia', serif" font-size="14" letter-spacing="3" font-style="italic" fill="#431407" text-anchor="middle">ROMANCE NATURALISTA</text>
  <text x="200" y="315" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#78350f" text-anchor="middle">QUADRO DE COSTUMES BRASILEIROS</text>

  <!-- Desenho / Brasão central -->
  <g transform="translate(200, 370)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#261c14" stroke-width="1.5"/>
    <path d="M -15 8 L 0 -15 L 15 8 Z" fill="#9a3412"/>
    <line x1="-20" y1="12" x2="20" y2="12" stroke="#261c14" stroke-width="2"/>
  </g>

  <!-- Dados da edição original: Garnier 1890 -->
  <line x1="110" y1="465" x2="290" y2="465" stroke="#261c14" stroke-width="1"/>
  <text x="200" y="495" font-family="'Georgia', serif" font-size="13" letter-spacing="3" font-weight="bold" fill="#261c14" text-anchor="middle">RIO DE JANEIRO</text>
  <text x="200" y="515" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#57534e" text-anchor="middle">B. L. GARNIER, LIVREIRO-EDITOR</text>
  <text x="200" y="535" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#9a3412" text-anchor="middle">1890</text>
</svg>
