<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-castro" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#eceff4"/>
      <stop offset="100%" stop-color="#d8dfea"/>
    </radialGradient>
  </defs>

  <rect width="400" height="580" fill="url(#bg-castro)"/>

  <!-- Moldura poética clássica -->
  <rect x="22" y="22" width="356" height="536" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="30" y="30" width="340" height="520" fill="none" stroke="#b91c1c" stroke-width="1.2"/>

  <!-- Autor -->
  <text x="200" y="115" font-family="'Georgia', serif" font-size="19" letter-spacing="4" font-weight="bold" fill="#0f172a" text-anchor="middle">CASTRO ALVES</text>
  <line x1="120" y1="135" x2="280" y2="135" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Título principal -->
  <text x="200" y="220" font-family="'Georgia', serif" font-size="32" letter-spacing="4" font-weight="bold" fill="#0f172a" text-anchor="middle">O NAVIO</text>
  <text x="200" y="260" font-family="'Georgia', serif" font-size="36" letter-spacing="4" font-weight="bold" fill="#b91c1c" text-anchor="middle">NEGREIRO</text>

  <!-- Subtítulo e coleção -->
  <text x="200" y="305" font-family="'Georgia', serif" font-size="14" letter-spacing="3" font-style="italic" fill="#334155" text-anchor="middle">E ESPUMAS FLUTUANTES</text>
  <text x="200" y="335" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#64748b" text-anchor="middle">POESIAS ABOLICIONISTAS</text>

  <!-- Ornato poético central -->
  <g transform="translate(200, 390)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <text x="0" y="8" font-family="'Georgia', serif" font-size="22" fill="#b91c1c" text-anchor="middle">⚓</text>
  </g>

  <!-- Edição original 1870 -->
  <line x1="110" y1="475" x2="290" y2="475" stroke="#0f172a" stroke-width="1"/>
  <text x="200" y="500" font-family="'Georgia', serif" font-size="13" letter-spacing="3" font-weight="bold" fill="#0f172a" text-anchor="middle">BAHIA — BRASIL</text>
  <text x="200" y="520" font-family="'Georgia', serif" font-size="11" letter-spacing="1.5" fill="#475569" text-anchor="middle">TYPOGRAPHIA DE CAMILLO DE LELLIS</text>
  <text x="200" y="540" font-family="'Georgia', serif" font-size="12" letter-spacing="2" font-weight="bold" fill="#b91c1c" text-anchor="middle">1870</text>
</svg>
