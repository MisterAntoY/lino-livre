<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Glowing halo -->
  <circle cx="256" cy="230" r="140" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Open Book Emblem -->
  <g transform="translate(256, 250)">
    <!-- Book Spine Glow -->
    <path d="M 0 -70 L 0 100" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Left Page -->
    <path d="M -10 -60 C -60 -75 -130 -65 -170 -40 C -175 -36 -175 60 -175 75 C -135 50 -65 60 -10 75 Z" 
          fill="url(#emeraldGrad)" opacity="0.95"/>
    
    <!-- Left Page Details (Text Lines) -->
    <path d="M -145 -15 C -115 -30 -65 -25 -35 -15" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -145 15 C -115 0 -65 5 -35 15" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M -145 45 C -115 30 -65 35 -35 45" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Right Page -->
    <path d="M 10 -60 C 60 -75 130 -65 170 -40 C 175 -36 175 60 175 75 C 135 50 65 60 10 75 Z" 
          fill="#f8fafc"/>
    
    <!-- Right Page Details (Text Lines) -->
    <path d="M 35 -15 C 65 -25 115 -30 145 -15" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 15 C 65 5 115 0 145 15" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 45 C 65 35 115 30 145 45" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

    <!-- Rising Sun / Knowledge Star above the book -->
    <circle cx="0" cy="-115" r="22" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M 0 -150 L 0 -140" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -25 -140 L -18 -133" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 25 -140 L 18 -133" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M -35 -115 L -25 -115" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 -115 L 25 -115" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title Badge in Icon -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">LINO LIVRE</text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="19" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="3">ACERVO ABERTO</text>
</svg>