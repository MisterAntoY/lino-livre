name: 🏛️ Sincronização Semanal - Santander Open Academy

on:
  schedule:
    # Executa toda segunda-feira às 07:00 UTC (1 em 1 semana)
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-santander:
    name: 🏛️ Atualizar Chamadas & Deadlines Santander Academy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔄 Executar sincronizador Santander Open Academy
        run: node scripts/sync_santander_academy.js

      - name: 🧪 Validar integridade dos testes
        run: npm test

      - name: 💾 Commit e Push das atualizações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Apenas ficheiros versionados: seed.sql e biblioteca.db estão no
          # .gitignore (artefactos locais) e faziam o `git add` falhar com
          # código 1, abortando o passo antes do commit.
          git add src/database/santanderAcademyData.json docs/plataformas/SANTANDER-ACADEMY-STATUS.md
          if git diff --staged --quiet; then
            echo "Nenhuma convocatória nova identificada nesta ronda semanal do Santander Academy."
          else
            git commit -m "chore(sync): atualizar chamadas e prazos do Santander Open Academy [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
