name: CI/CD - Deploy Lino Livre (Cloudflare Workers)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Testes & Verificação de Tipos
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔍 Verificação de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Executar Testes Automatizados
        run: npm test

  deploy:
    name: 🚀 Deploy para Cloudflare Workers & D1
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      # Diagnóstico ANTES de qualquer escrita: identifica token ausente,
      # conta errada ou falta de permissão (ex.: D1: Edit) com mensagem clara.
      # Não bloqueia o deploy — migrações e deploy têm permissões diferentes.
      - name: 🪪 Diagnóstico de credenciais Cloudflare
        id: credenciais
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Segredo CLOUDFLARE_API_TOKEN não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx wrangler whoami || exit 1
          # Teste de leitura na D1: exige o escopo "D1: Edit" no token.
          npx wrangler d1 migrations list lino-livre-db --remote

      - name: 🗄️ Aplicar Migrações D1 (Remoto)
        id: migracoes
        if: steps.credenciais.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply lino-livre-db --remote

      # A API da D1 pode falhar transitoriamente (HTTP 5xx). Uma repetição
      # evita derrubar o pipeline por instabilidade momentânea.
      - name: 🔁 Repetir Migrações D1 (uma tentativa)
        if: steps.migracoes.outcome == 'failure'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          echo "↻ A repetir migrações D1 em 20s…"
          sleep 20
          npx wrangler d1 migrations apply lino-livre-db --remote

      - name: ⚠️ Aviso — migrações D1 não aplicadas
        if: steps.credenciais.outcome == 'failure' || steps.migracoes.outcome == 'failure'
        run: |
          echo "::warning::Migrações D1 não aplicadas (token sem 'D1: Edit', conta errada ou API indisponível). O deploy do Worker continuará. Corrija o segredo CLOUDFLARE_API_TOKEN e aplique as migrações com: npx wrangler d1 migrations apply lino-livre-db --remote"

      - name: 🚀 Deploy Worker & Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
