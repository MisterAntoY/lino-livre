name: CI/CD - Deploy Lino Livre (Cloudflare Workers)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # A conta está no plano gratuito da D1, cujo limite diário de linhas lidas
  # (5M/dia) repõe às 00:00 UTC. Quando a cota esgota, nem as migrações nem
  # o deploy consegue falar com a D1 (erro 7500) e o site devolve 503.
  # O cron do Worker (00:10 UTC) repõe os agregados pré-calculados logo após
  # a reposição — por isso o deploy agendado corre às 00:05 UTC: aplica as
  # migrações pendentes e publica o Worker a tempo de o cron às 00:10 reduzir
  # o consumo de leituras para ~300 linhas por pedido.
  schedule:
    - cron: '5 0 * * *'

# Princípio do menor privilégio: o CI só precisa de ler o código.
permissions:
  contents: read

jobs:
  test:
    name: 🧪 Testes & Verificação de Tipos
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔍 Verificação de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Executar Testes Automatizados
        run: npm test

  deploy:
    name: 🚀 Deploy para Cloudflare Workers & D1
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      # Diagnóstico ANTES de qualquer escrita: identifica token ausente,
      # conta errada ou falta de permissão (ex.: D1: Edit) com mensagem clara.
      - name: 🪪 Diagnóstico de credenciais Cloudflare
        id: credenciais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Segredo CLOUDFLARE_API_TOKEN não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          # 1) Autenticação básica. Se falhar aqui, o deploy também falharia.
          if ! WHOAMI=$(npx wrangler whoami 2>&1); then
            echo "$WHOAMI"
            if echo "$WHOAMI" | grep -q "9109"; then
              echo "::error::O CLOUDFLARE_API_TOKEN tem 'Client IP Address Filtering' ativo (erro 9109). Os IPs dos runners do GitHub são dinâmicos: em My Profile → API Tokens → Edit, remova o filtro de IP (ou use 'Allow all IPs') e guarde o token."
            elif echo "$WHOAMI" | grep -q "10000"; then
              echo "::error::CLOUDFLARE_API_TOKEN inválido ou sem permissões na conta. Crie um token com Workers Scripts: Edit e D1: Edit."
            else
              echo "::error::Falha ao autenticar na Cloudflare com o CLOUDFLARE_API_TOKEN."
            fi
            exit 1
          fi
          echo "$WHOAMI"

          # 2) Acesso à D1 (exige "D1: Edit"). Falha aqui interrompe o deploy,
          # exceto se a quota de leitura estiver esgotada (7500): nesse caso,
          # prossegue para publicar o Worker com resiliência e fallback ativo.
          if ! D1=$(npx wrangler d1 migrations list lino-livre-db --remote 2>&1); then
            echo "$D1"
            if echo "$D1" | grep -q "7500"; then
              echo "::warning::Quota da D1 esgotada (erro 7500). Prosseguindo com deploy do Worker para manter o site ativo com modo de resiliência e catálogo fallback."
              echo "D1_ESGOTADA=1" >> "$GITHUB_ENV"
            elif echo "$D1" | grep -q "9109"; then
              echo "::error::Token com filtro de IP (9109): a D1 não será acessada até o filtro ser removido."
              exit 1
            else
              echo "::error::Token sem acesso à D1 (falta o escopo 'D1: Edit'): migrações são obrigatórias para o deploy."
              exit 1
            fi
          fi
          echo "$D1"

      - name: 🗄️ Aplicar Migrações D1 (Remoto com backoff)
        id: migracoes
        if: env.D1_ESGOTADA != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "🔄 Aplicando migrações D1..."
          if ! npx wrangler d1 migrations apply lino-livre-db --remote; then
            echo "::warning::Primeira tentativa de migração falhou. Repetindo migrações D1 com backoff de 20s..."
            sleep 20
            npx wrangler d1 migrations apply lino-livre-db --remote
          fi

      - name: 🚀 Deploy Worker & Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: 🧪 Smoke Test de Produção (Endpoints Públicos)
        run: |
          set -uo pipefail
          echo "🔍 A verificar disponibilidade dos endpoints essenciais..."
          WORKER_URL="https://lino-livre.linolivre.workers.dev"

          # 1. Página inicial
          HTTP_HOME=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/")
          echo "GET / -> HTTP $HTTP_HOME"
          if [ "$HTTP_HOME" -ne 200 ]; then
            echo "::error::Página inicial respondeu com HTTP $HTTP_HOME"
            exit 1
          fi

          # 2. Dashboard
          HTTP_DASH=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/api/dashboard")
          echo "GET /api/dashboard -> HTTP $HTTP_DASH"
          if [ "$HTTP_DASH" -ne 200 ] && [ "$HTTP_DASH" -ne 503 ]; then
            echo "::error::Dashboard respondeu com HTTP $HTTP_DASH (esperado 200 ou 503 degradado)"
            exit 1
          fi

          # 3. Livros (paginação)
          HTTP_LIVROS=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/api/livros?page=1&limit=5")
          echo "GET /api/livros -> HTTP $HTTP_LIVROS"
          if [ "$HTTP_LIVROS" -ne 200 ] && [ "$HTTP_LIVROS" -ne 503 ]; then
            echo "::error::API de livros respondeu com HTTP $HTTP_LIVROS"
            exit 1
          fi

          # 4. Cursos
          HTTP_CURSOS=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/api/cursos?limit=5")
          echo "GET /api/cursos -> HTTP $HTTP_CURSOS"
          if [ "$HTTP_CURSOS" -ne 200 ] && [ "$HTTP_CURSOS" -ne 503 ]; then
            echo "::error::API de cursos respondeu com HTTP $HTTP_CURSOS"
            exit 1
          fi

          # 5. Sugestões de moderação (POST sem dados deve dar 400)
          HTTP_SUG=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WORKER_URL/api/sugestoes" -H "Content-Type: application/json" -d '{}')
          echo "POST /api/sugestoes (validação) -> HTTP $HTTP_SUG"
          if [ "$HTTP_SUG" -ne 400 ]; then
            echo "::error::POST /api/sugestoes não validou payload corretamente (esperado 400, obteve $HTTP_SUG)"
            exit 1
          fi

          # 6. Autenticação Administrativa (POST /api/livros sem auth deve retornar 401)
          HTTP_AUTH=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WORKER_URL/api/livros" -H "Content-Type: application/json" -d '{}')
          echo "POST /api/livros sem auth -> HTTP $HTTP_AUTH"
          if [ "$HTTP_AUTH" -ne 401 ]; then
            echo "::error::POST /api/livros sem autenticação não respondeu 401 (obteve $HTTP_AUTH)"
            exit 1
          fi

          # 7. WAF de Borda (User-Agent ofensivo sqlmap deve retornar 403)
          HTTP_WAF=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_URL/api/livros" -H "User-Agent: sqlmap/1.7")
          echo "GET /api/livros com UA sqlmap -> HTTP $HTTP_WAF"
          if [ "$HTTP_WAF" -ne 403 ]; then
            echo "::error::WAF de borda não bloqueou User-Agent ofensivo (esperado 403, obteve $HTTP_WAF)"
            exit 1
          fi

          echo "✅ Todos os smoke tests de produção passaram com sucesso!"
