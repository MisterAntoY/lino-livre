name: CI/CD - Deploy Lino Livre (Cloudflare Workers)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Testes & Verificação de Tipos
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔍 Verificação de Tipos (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Executar Testes Automatizados
        run: npm test

  deploy:
    name: 🚀 Deploy para Cloudflare Workers & D1
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      # Diagnóstico ANTES de qualquer escrita: identifica token ausente,
      # conta errada ou falta de permissão (ex.: D1: Edit) com mensagem clara.
      # Não bloqueia o deploy — migrações e deploy têm permissões diferentes.
      - name: 🪪 Diagnóstico de credenciais Cloudflare
        id: credenciais
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Segredo CLOUDFLARE_API_TOKEN não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          # 1) Autenticação básica. Se falhar aqui, o deploy também falharia.
          if ! WHOAMI=$(npx wrangler whoami 2>&1); then
            echo "$WHOAMI"
            if echo "$WHOAMI" | grep -q "9109"; then
              echo "::error::O CLOUDFLARE_API_TOKEN tem 'Client IP Address Filtering' ativo (erro 9109). Os IPs dos runners do GitHub são dinâmicos: em My Profile → API Tokens → Edit, remova o filtro de IP (ou use 'Allow all IPs') e guarde o token."
            elif echo "$WHOAMI" | grep -q "10000"; then
              echo "::error::CLOUDFLARE_API_TOKEN inválido ou sem permissões na conta. Crie um token com Workers Scripts: Edit e D1: Edit."
            else
              echo "::error::Falha ao autenticar na Cloudflare com o CLOUDFLARE_API_TOKEN."
            fi
            exit 1
          fi
          echo "$WHOAMI"

          # 2) Acesso de leitura à D1 (exige "D1: Edit"). Falha aqui não
          #    bloqueia o deploy, mas impede as migrações.
          if ! D1=$(npx wrangler d1 migrations list lino-livre-db --remote 2>&1); then
            echo "$D1"
            if echo "$D1" | grep -q "9109"; then
              echo "::warning::Token com filtro de IP (9109): a D1 não será acessada até o filtro ser removido."
            else
              echo "::warning::Token sem acesso à D1 (falta o escopo 'D1: Edit'): migrações serão ignoradas."
            fi
            exit 1
          fi
          echo "$D1"

      - name: 🗄️ Aplicar Migrações D1 (Remoto)
        id: migracoes
        if: steps.credenciais.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply lino-livre-db --remote

      # A API da D1 pode falhar transitoriamente (HTTP 5xx). Uma repetição
      # evita derrubar o pipeline por instabilidade momentânea.
      - name: 🔁 Repetir Migrações D1 (uma tentativa)
        if: steps.migracoes.outcome == 'failure'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "↻ A repetir migrações D1 em 20s…"
          sleep 20
          npx wrangler d1 migrations apply lino-livre-db --remote

      - name: ⚠️ Aviso — migrações D1 não aplicadas
        if: steps.credenciais.outcome == 'failure' || steps.migracoes.outcome == 'failure'
        run: |
          echo "::warning::Migrações D1 não aplicadas (token sem 'D1: Edit', conta errada ou API indisponível). O deploy do Worker continuará. Corrija o segredo CLOUDFLARE_API_TOKEN e aplique as migrações com: npx wrangler d1 migrations apply lino-livre-db --remote"

      - name: 🚀 Deploy Worker & Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
